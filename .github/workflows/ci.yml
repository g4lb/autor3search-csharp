name: ci

on:
  push:
    branches: [main]
    # The release job below is gated on refs/tags/v*, which is only ever reachable
    # if tag pushes trigger this workflow at all. Without this line the gate is
    # unreachable: tagging runs nothing, and the tag looks like a release that
    # published nothing.
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal --logger "trx;LogFileName=results.trx"

      # The README states a test count, and a count in prose drifts the moment a test
      # is added -- it already shipped stale once. Read from the trx the run just
      # produced rather than re-running anything, on one platform because the number
      # is the same on all three. A trx logger is used instead of piping the Test step
      # through tee so the Windows leg keeps running under its default shell.
      - name: README test count is current
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          total=$(find . -name results.trx -print0 \
            | xargs -0 grep -ho 'total="[0-9]*"' \
            | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          claimed=$(grep -oE '^[0-9]+ tests, none skipped' README.md | grep -oE '^[0-9]+' || true)
          echo "suite=$total readme=${claimed:-<none>}"
          if [ -z "$claimed" ]; then
            echo "could not find the 'N tests, none skipped' claim in README.md" >&2
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "parsed zero tests from the trx files -- the parse, not the suite, is wrong" >&2
            exit 1
          fi
          if [ "$total" -ne "$claimed" ]; then
            echo "README claims $claimed tests, the suite has $total" >&2
            exit 1
          fi

  # Installs the PUBLISHED package from nuget.org and drives it on all three
  # platforms. The build job above compiles and tests source, which is a different
  # claim: it never installs what it ships. Both defects found after v0.1.0 -- a
  # binary stamped +local, and a tool that would not launch at all where the runtime
  # sits outside the launcher's search path -- were invisible to it for that reason.
  # This job fails if the thing a user actually installs does not run.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the published tool from nuget.org
        run: |
          set -euo pipefail
          dotnet tool install -g autor3search-csharp
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: It runs at all
        run: |
          set -euo pipefail
          autor3search-csharp version
          # No arguments is a usage error and exits 2 by design, so the invocation
          # cannot sit in the pipeline under `set -e` -- capture first, then match.
          usage="$(autor3search-csharp 2>&1 || true)"
          echo "$usage" | grep -q 'usage: autor3search-csharp'

      - name: doctor exits 0 even when it has warnings
        run: |
          set -uo pipefail
          # The exit-0 contract is load-bearing: an agent loop reads doctor's text,
          # never its status, so a non-zero exit would halt runs on a machine that is
          # merely noisy rather than unusable. `set -e` is deliberately off here: it
          # would abort before the check and make any failure look like a crash, and
          # $? after a command `set -e` already guaranteed to succeed can only be 0 --
          # an assertion that cannot fail is not one.
          autor3search-csharp doctor
          code=$?
          echo "doctor exit: $code"
          test "$code" -eq 0

      - name: init, baseline and status on a real repository
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -R testdata/demo "$work/demo"
          cd "$work/demo"
          git init -q .
          git config user.email smoke@example.com
          git config user.name  "smoke test"
          git add -A
          git commit -q -m "demo fixture"

          # init must discover the fixture's [Benchmark] methods. It refuses to write
          # a config when it finds none, so a silent discovery regression fails here
          # rather than producing a harness that measures nothing.
          autor3search-csharp init
          test -f .autor3search/config.yaml
          test -f program.md
          git add -A
          git commit -q -m "autor3search-csharp init"

          # baseline exercises the parts most likely to differ per platform: the
          # out-of-tree state directory, freezing files by hash, and pinning a
          # detached worktree.
          autor3search-csharp baseline -tag smoke
          autor3search-csharp status
          git rev-parse --verify autor3search-csharp/smoke

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # OIDC token issuance for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        # SourceRevisionId must be passed explicitly. It defaults to "local", and a
        # released binary stamped "local" breaks the traceability `version` promises:
        # every results.tsv row records this string so a row can be tied back to the
        # binary that produced it. v0.1.0 shipped as 0.1.0+local for this reason.
        run: |
          dotnet pack src/Autor3Search.Cli -c Release -o nupkg \
            /p:Version=${GITHUB_REF_NAME#v} \
            /p:SourceRevisionId=${GITHUB_SHA}
      # Trusted publishing: exchange GitHub's OIDC token for a short-lived nuget.org
      # API key instead of storing a long-lived secret. The key is valid for one hour,
      # so it is requested immediately before the push rather than earlier in the job.
      - name: NuGet login (OIDC to short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org PROFILE NAME (not an email, and not a credential — it is
          # public). This must be the account or organization that owns the package
          # AND the trusted-publishing policy for it. Set the NUGET_USER repository
          # variable to override; the default is the autor3search organization.
          user: ${{ vars.NUGET_USER || 'autor3search' }}

      - name: Publish to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
