name: ci

on:
  push:
    branches: [main]
    # The release job below is gated on refs/tags/v*, which is only ever reachable
    # if tag pushes trigger this workflow at all. Without this line the gate is
    # unreachable: tagging runs nothing, and the tag looks like a release that
    # published nothing.
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # OIDC token issuance for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        run: dotnet pack src/Autor3Search.Cli -c Release -o nupkg /p:Version=${GITHUB_REF_NAME#v}
      # Trusted publishing: exchange GitHub's OIDC token for a short-lived nuget.org
      # API key instead of storing a long-lived secret. The key is valid for one hour,
      # so it is requested immediately before the push rather than earlier in the job.
      - name: NuGet login (OIDC to short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org PROFILE NAME (not an email, and not a credential — it is
          # public). Falls back to the account that owns the trusted-publishing policy,
          # so no repository secret is required; set NUGET_USER only to override it.
          user: ${{ secrets.NUGET_USER || 'g4lb' }}

      - name: Publish to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
